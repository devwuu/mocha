spring:
  application:
    name: mocha
  # T0-2 실측용: 로컬 비밀(.env.local, KEY=VALUE)을 프로퍼티 소스로 로드해 ${OPENAI_API_KEY} 등을 바인딩.
  # optional: 파일 없으면 기동 실패 없이 스킵(CI/미설정 프로파일 안전). .env.local은 .gitignore 대상.
  config:
    import: "optional:file:.env.local[.properties]"

  # 저장소 = Postgres (ref: changes/0028-rdb-storage/delta.md#ADR-73). 로컬 인스턴스는 docker-compose.yml.
  # 접속 정보는 환경변수로 덮을 수 있게 두되 default를 로컬 컨테이너에 맞춘다 — 클라우드 이전(델타 B)에서
  # 코드·설정 변경 없이 주입만으로 대상을 바꾸기 위함. 로컬 자격증명은 비밀이 아니다(docker-compose.yml POLICY).
  datasource:
    url: ${MOCHA_DB_URL:jdbc:postgresql://localhost:5432/mocha}
    username: ${MOCHA_DB_USERNAME:mocha}
    password: ${MOCHA_DB_PASSWORD:mocha}
  jpa:
    hibernate:
      # 스키마 소유권은 Flyway 단독이다. validate = 엔티티 매핑과 실제 DDL의 드리프트를 기동 시 잡는다.
      # create/update로 두면 마이그레이션 이력과 실제 스키마가 갈라진다.
      ddl-auto: validate
    # 트랜잭션 경계는 tx-service가 소유한다(ADR-77) — 응답 직렬화까지 세션을 끌고 갈 이유가 없다.
    # 웹 계층이 생긴 뒤(ADR-78)에도 그대로다: 뷰가 지연 로딩을 트리거하면 트랜잭션 밖에서 쿼리가 나간다.
    open-in-view: false
  flyway:
    # 마이그레이션 파일명은 델타 번호와 대응시킨다(V1__0028_..., Q-10) — 스키마 이력이 델타와 1:1로 추적된다.
    locations: classpath:db/migration

  # 사진 업로드(POST /api/photos, changes/0029 TΔ8a). 부트 기본값이 파일당 1MB인데 아이폰 원본 JPEG는
  # 보통 2~5MB라 기본값으로는 정상 업로드가 전부 413으로 떨어진다. 상한은 vision 1콜 이미지 상한
  # (mocha.vision.max-images=4)과 짝이다 — 한 메시지에 4장까지가 실제로 읽히는 양이다.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 60MB

  # 정적 매핑은 WebConfig가 단독 소유한다(ADR-78) — SPA fallback 때문에 리졸버를 직접 얹어야 하고,
  # 부트 기본 매핑을 켜 두면 같은 "/**" 패턴이 둘 등록되어 승자가 등록 순서에 달린다.
  web:
    resources:
      add-mappings: false

# 웹 서버 포트. 값은 부트 default와 같지만 명시한다 — frontend/vite.config.ts의 dev 프록시 대상과
# TΔ17(Tailscale ACL로 노출할 포트)이 이 값을 짝으로 삼는다(ADR-50 "yml에 초기값 명시" 관례).
server:
  port: 8080

# 파일 로깅 (NFR-7, ADR-21 · changes/0009). Spring 표준 logback 설정 — 콘솔과 병행해 logs/ 아래 상시 기록.
# 레벨은 root 기본(INFO 이상 전체 — 에러 앞뒤 맥락 보존). 일 단위 롤링 + 30일 보존 + 총 300MB 상한.
# POLICY: logs/는 개인 데이터 취급 — 사용자 메시지 원문이 남을 수 있어 커밋·공개 금지(.gitignore 유지, 루트 CLAUDE.md §5).
logging:
  file:
    name: logs/mocha.log
  logback:
    rollingpolicy:
      # %d=일 단위 롤링, %i=크기 분할 인덱스(SizeAndTimeBased). .gz로 롤링분 압축.
      file-name-pattern: logs/mocha.%d{yyyy-MM-dd}.%i.log.gz
      max-history: 30
      total-size-cap: 300MB

# 모카 설정 골격 (튜닝 대상, ref: plan.md §5). 코드 default와 별개로 여기서 초기값 명시.
mocha:
  # mocha.slack.* (Socket Mode 토큰 2종)은 changes/0029 TΔ16에서 삭제됐다 — 수신 계층이 사라져 주입할
  # 곳이 없다. 남은 비밀은 OpenAI 키 하나다.
  openai:
    # OpenAI API 키(종량제). 비밀이므로 코드/설정에 하드코딩 금지 —
    # 환경변수(.env → .env.local)로 주입. 미설정 시 빈 값 → 실제 호출 시에만 필요(컨텍스트/CI 안전).
    api-key: ${OPENAI_API_KEY:}
  # 에이전트 루프·트랜스크립트 (ADR-44/46/50, changes/0018). 상한·TTL은 초기 운영 튜닝 대상이라
  # 설정 키로 승격했다(ADR-50 — 코드 상수 관례의 사용자 확정 예외).
  agent:
    # 에이전트 루프 모델 — 다중 tool 호출 품질 필요(web_search 가용 요구는 TΔ24c에서 소멸 — 루프가 내장
    # 도구를 장착하지 않는다). 초기값 gpt-5.4-mini(0018 TΔ0a 실측)는
    # 다중 날짜 분리 규칙(AC-77) 반복 위반 관측으로 gpt-5.4로 교체(changes/0021 TΔ3b 스모크, 2026-07-21 사용자 확정).
    model: gpt-5.4
    # 턴 상한 3종(ADR-44·62) — 도달 시 결정론 폴백(ADR-48). 값은 코드 default와 동일(ADR-50 관례).
    # 턴당 function tool 실행 상한.
    max-tool-calls: 8
    # 턴 누적 토큰 상한 — 이터레이션별 usage(in+out) 합산 판정. 관측 표본 부족(6건)으로 보수적 시작,
    # 누적 usage 관측이 쌓이면 조정(plan §5·§6, changes/0027 findings-TΔ4 §4.1).
    max-turn-tokens: 100000
    # 턴 경과 시간 상한 — 이터레이션 경계 판정. 관측 턴 소요 2.9~19.8초(0026 eval 21턴 실측 — plan §5)
    # 대비 약 3배 여유. (그 실측 당시의 상단은 web_search가 도는 턴이었다 — TΔ24c로 루프에서 검색이
    # 빠졌으므로 상단이 내려올 수 있다. 관측 후 조정 대상이고, 지금 내리지는 않는다.)
    # 모델 호출의 HTTP 요청 타임아웃도 이 값의 잔여 예산에서 파생된다(ADR-70 ① — 별도 요청 타임아웃 키 없음).
    # 절단 경로는 SDK 기본 재시도(2회) 때문에 최악 3배까지 늘어난다(ADR-70 ① 수렴 한계 노트).
    turn-timeout: 60s
    # 응답 1건의 출력 토큰 상한 — 요청에 실어(max_output_tokens) 폭주를 발생 전에 자른다(ADR-70 ②).
    # 위 누적 상한은 응답 도착 후 판정이라 단일 응답 폭주의 비용은 이미 지불된 뒤다. 초기값 4000 =
    # 0026 eval 21턴 실측(응답당 출력 110~336)의 약 4배 여유(changes/0027 findings-TΔ4 §4.4).
    # reasoning 토큰도 이 상한에 포함되므로, 절단(incomplete/max_output_tokens) 관측 시 상향한다.
    max-output-tokens: 4000
    # 작업 트랜스크립트 턴 수 상한·TTL (ADR-46) — 초과분 드롭·경과 시 빈 문맥.
    transcript-max-turns: 20
    transcript-ttl: 1h
    # 다중 날짜 세그먼트 분리 전용 경량 모델 (ADR-50·61 — 분리만 하는 좁은 작업이라 루프 모델과 분리).
    # 값은 코드 default와 동일(AgentConfig) → 동작 무변경. 위 상한 키들과 함께 yaml로 올렸다
    # (changes/0027 TΔ4b — ADR-50 "yml에 초기값 명시" 관례 누락 보정).
    # 이 키는 행동 레이어다(delta 0027 UNCHANGED 행) — 값을 바꾸면 evalTest 전/후 기록이 필요하다(ADR-69 ②).
    segmenter-model: gpt-5.4-mini
  vision:
    # 수신 사진 OCR 전용 경량 모델 (ADR-50 — 구 search.model 공용에서 분리, 전처리에 상위 모델 낭비 금지).
    model: gpt-5.4-mini
    # 수신 사진 OCR(FR-19) 1콜당 이미지 상한 — 초과분은 vision 호출 제외(첨부로만) (ADR-23).
    max-images: 4
  alias:
    # 별칭 생성(ADR-37) 전용 모델 — 텍스트 전용 최경량 (ADR-50).
    model: gpt-5.4-nano
  # 검색 보강 (FR-3 · changes/0029 TΔ24b, delta D-16). changes/0018 TΔ8b에서 폐기됐던 키가 돌아왔다 —
  # 보강이 «모델 재량 tool»에서 «제안 후 결정론 단계»로 되돌아가며 다시 이 경계가 콜을 소유한다.
  search:
    # 검색 보강 전용 모델 (ADR-50 역할별 키). web_search로 로스터리 공식 페이지에 착지하는 능력이
    # 이 콜의 전부라 경량으로 내리지 않는다 — 값이 루프 모델과 같지만 키는 별개다(관측 후 개별 조정).
    model: gpt-5.4
    # 보강 검색 출처 상한 — 비용/지연 통제(plan §5). sources에 담기는 참조 링크 개수의 상한이다.
    max-results: 3
  # mocha.photo.buffer-window(텍스트/사진 분리 수신 그룹핑 윈도우, FR-10)는 changes/0029 TΔ16에서
  # 삭제됐다 — 앱에서는 사용자가 ＋ 버튼으로 사진과 발화를 직접 묶어 추정할 윈도우가 없다(D-3·D-11).
  data:
    # 사진 원본 루트 (커밋 금지). 노트는 DB로 옮겨졌다(0028 ADR-73).
    dir: ./data
  artifact:
    # 산출물(파생물) 루트 — 회차 카드 JPG (커밋 금지, 전체 재생성 가능).
    dir: ./artifact
    # 카드 디자인 테마. type-a=세리프(명조·액자), type-b=귀여운(고딕·카드·마스코트).
    # 값은 templates/<theme>/ 폴더명이자 렌더 선택자다. 미설정 시 코드 default = type-a(세리프 — ADR-54).
    theme: type-a
  card:
    # 시음 엔트리 카드 이미지(JPG) 뷰포트 (ref: plan.md#ADR-10/ADR-11 §5). 인스타 4:5 = 1080×1350.
    # 비율(4:5) 자체는 상수 — 설정 키로 바꾸지 않는다. width/height는 고해상도 배수 대응용 크기 파라미터일 뿐.
    width: 1080
    height: 1350
    # 카드 JPG 품질(0~1). 파일 크기/화질 균형 — 구 근거는 Slack 업로드 용량이었고, 공유가 앱의
    # 이미지 저장으로 바뀐 뒤로는 저장·전송할 파일 크기 자체가 근거다(TΔ9).
    jpg-quality: 0.9

---
# CLI --rerender(전체 리렌더 후 종료, ADR-7 §테마)는 1회성 배치다 — 웹 서버를 띄우지 않는다.
# 띄우면 리렌더가 끝나도 프로세스가 포트를 물고 살아남아 "돌고 종료한다"는 성질이 깨지고,
# 상주 중인 본 프로세스와 포트가 충돌한다(구 Slack 소켓을 배제하던 것과 같은 이유 — TΔ16에서 소켓 쪽이
# 사라진 뒤로는 이 프로파일이 배제하는 상주 자원이 웹 서버 하나다).
spring:
  config:
    activate:
      on-profile: rerender
  main:
    web-application-type: none
