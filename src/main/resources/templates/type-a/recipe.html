<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title th:text="${card.coffeeName} + ' · 모카'">커피 레시피</title>
<style>
  /* 로컬 번들 폰트(ADR-11, 이식 편차 — 시안의 Google Fonts CDN 대체). artifact/fonts/는 렌더러가 채운다. */
  @font-face{font-family:'Gowun Batang';src:url('fonts/GowunBatang-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
  @font-face{font-family:'Gowun Batang';src:url('fonts/GowunBatang-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
  html,body{margin:0;padding:0}
  /* 카드 = 4:5(1080×1350) 뷰포트 스크린샷. 시안 실측 460×575(동일 4:5)를 치수 무환산으로 이식하고
     스케일 래퍼(×1080/460)로 실 규격을 채운다 — 시안이 디자인 원본이라 환산 전사 오류를 없앤다(ADR-54).
     autofit 측정은 레이아웃 좌표라 하한도 시안 값(10.5) 그대로다. */
  body{width:1080px;height:1350px;overflow:hidden;background:#efe9e2}
  .scale{width:460px;height:575px;transform:scale(2.3478260870);transform-origin:top left}
</style>
</head>
<body>
<div class="scale">
<div style="width:460px;height:575px;background:#d9cfc4;border-radius:6px;box-shadow:0 2px 12px rgba(43,31,22,.12);display:flex;box-sizing:border-box;padding:16px;font-family:'Gowun Batang',serif;color:#3a3128">
  <div style="flex:1;border:1px solid #7a6a5c;display:flex;flex-direction:column;padding:22px 30px 14px;box-sizing:border-box;background:#f1ece4">
    <!--/* FR-7 ①: 상단 헤더 — "BREW RECIPE"는 카드에 인쇄되는 영문 디자인 라벨이라 개명 대상이 아니다(changes/0030 TΔ3). */-->
    <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #b3a595;padding-bottom:10px">
      <div style="font-size:10.5px;letter-spacing:3px;color:#7c6b5b">BREW RECIPE</div>
      <div style="font-size:10.5px;letter-spacing:1px;color:#7c6b5b" th:text="${fmt.dotted(card.date)}">2026. 7. 10</div>
    </div>
    <!--/* FR-7 ②: 로스터리·커피명 + 방식 뱃지(method 그대로, 없으면 생략).
         POLICY: method는 표시 전용이다 — 이 아래 어디에서도 분기 조건으로 쓰지 않는다(ADR-87). */-->
    <div style="padding:14px 0 12px;border-bottom:1px solid #d3c9bb;text-align:center">
      <div style="font-size:11.5px;color:#64564a;margin-bottom:4px"
           th:text="${card.roastery != null ? card.roastery + ' · ' + card.coffeeName : card.coffeeName}">커피베라 · 봄맞이 블렌드</div>
      <div style="display:flex;justify-content:center;align-items:center;gap:10px">
        <div style="font-size:22px;font-weight:700;line-height:1.35;color:#2e261f">레시피</div>
        <div style="font-size:10.5px;letter-spacing:2px;color:#64564a;border:1px solid #b0a494;border-radius:999px;padding:2px 12px"
             th:if="${card.recipe.method != null}" th:text="${card.recipe.method}">핸드드립</div>
      </div>
    </div>
    <!--/* FR-7 ③ 3열 6타일 그리드 — 어느 값이 어느 칸에 가는지는 뷰 모델(NoteView.RecipeCard.tiles())이
         이미 확정해 넘긴다. 템플릿은 목록을 행 우선으로 흘려 넣기만 하고 판정을 하지 않는다(ADR-87).
         값 있는 타일만 담겨 오므로 3개면 1행이 차고 2개면 1행에 2칸만 차며, 남는 칸은 시안 그대로
         비워 둔다(그리드 배경이 드러난다 — 2026-08-10 사용자 확정. 채움 타일은 시안에 없다).
         단위·비율 접두는 뷰 모델에서 이미 붙어 있다(두 테마의 타일 어휘·표기가 시안에서 동일). */-->
    <th:block th:with="tiles=${card.tiles()}">
      <div style="margin:14px 0 0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1px;background:#d3c9bb;border:1px solid #d3c9bb"
           th:if="${!tiles.isEmpty()}">
        <div th:each="tile : ${tiles}"
             style="background:#f1ece4;padding:9px 6px;text-align:center;min-height:52px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box">
          <div style="font-size:9px;letter-spacing:1.5px;color:#8d7d6c;margin-bottom:3px" th:text="${tile.label()}">원두</div>
          <!--/* 시간 표기는 "2분 40초" — 시안의 2:40은 기각이다(이식 편차, ADR-87 D-7). 서브라벨(추출량의
               비율·분쇄도의 그라인더명)은 시안의 그라인더 span 자리를 그대로 쓴다. */-->
          <div style="font-size:17px;font-weight:700;color:#2e261f"><span th:text="${tile.value()}">210</span><span
               style="font-size:10px;font-weight:400;color:#7c6b5b;margin-left:4px"
               th:if="${tile.sub() != null}" th:text="${tile.sub()}">매버릭 2.0</span></div>
        </div>
      </div>
    </th:block>
    <!--/* FR-7 ④⑤ 텍스트 블록 2종(상세 레시피·레시피 피드백) — 둘 다 autofit이다(D-9로 상세 레시피가 합류).
         값 없는 블록은 통째로 숨긴다(AC-25). 시안에 없는 이 래퍼가 필요한 이유는 «숨김»과 «푸터 고정»이
         충돌하기 때문이다: 블록이 사라지면 자리를 밀어낼 flex:1이 없어져 푸터가 위로 딸려 올라온다.
         래퍼가 남은 공간을 통째로 받고 살아 있는 블록끼리 나눠 가지므로, 둘 다 있을 때의 기하는
         시안(각 flex:1 형제)과 동일하고 하나·영일 때만 갈린다. */-->
    <div style="flex:1;min-height:0;display:flex;flex-direction:column">
      <!--/* white-space:pre-line — 사용자가 넣은 줄바꿈 보존(데이터 충실. 시안 예시는 단문이라 무영향).
           시안 예시 문장 말미의 "· 총 2분 40초" 자동 병기는 이식하지 않는다 — 시간 타일이 같은 값을
           이미 보여주므로 카드 안에 두 번 나온다(이식 편차, ADR-87 D-7). */-->
      <div style="flex:1;min-height:0;overflow:hidden;padding-top:14px;display:flex;flex-direction:column;gap:6px"
           th:if="${card.recipe.detail != null}">
        <div style="font-size:10px;letter-spacing:2px;color:#8d7d6c">상세 레시피</div>
        <div data-autofit="10.5" style="flex:1;min-height:0;overflow:hidden;font-size:15.5px;line-height:1.8;color:#2e261f;white-space:pre-line"
             th:text="${card.recipe.detail}">뜸 40ml 30초 → 1차 100ml 중심에서 원형으로 → 2차 100ml</div>
      </div>
      <div style="flex:1;min-height:0;overflow:hidden;padding-top:10px;margin-top:8px;border-top:1px solid #d3c9bb;display:flex;flex-direction:column;gap:6px"
           th:if="${card.recipe.feedback != null}">
        <div style="font-size:10px;letter-spacing:2px;color:#8d7d6c">레시피 피드백</div>
        <div data-autofit="10.5" style="flex:1;min-height:0;overflow:hidden;font-size:15.5px;line-height:1.8;color:#2e261f;white-space:pre-line"
             th:text="${card.recipe.feedback}">첫 모금이 살짝 떫었다. 다음엔 분쇄를 한 단계 굵게(220클릭), 물 온도는 90℃로.</div>
      </div>
    </div>
    <div style="border-top:1px solid #b3a595;margin-top:12px;padding:10px 0 2px;text-align:center;font-size:10px;letter-spacing:3px;color:#a09283">— 커피 독후감 · 모카 —</div>
  </div>
</div>
</div>
<script>
/* 시안 autofit 이식(ADR-54 — 대상은 상세 레시피·피드백 두 영역, 하한 = data-autofit 값. 상세 레시피의
   합류는 changes/0030 D-9). 정적 1회 렌더라 시안의 MutationObserver·resize 트리거는 제외하고
   즉시 1회 + fonts.ready 재실행으로 단순화했다.
   완료(data-autofit-done)·하한 도달(data-autofit-floor) 마커는 래스터화 대기·로깅 배선(plan §6)의 입력. */
(function(){
  function fit(el){
    if(!el.dataset.fitBase)el.dataset.fitBase=getComputedStyle(el).fontSize;
    el.style.fontSize=el.dataset.fitBase;
    el.removeAttribute('data-autofit-floor');
    var s=parseFloat(el.dataset.fitBase);
    var min=parseFloat(el.getAttribute('data-autofit'))||10;
    while(s>min && el.scrollHeight>el.clientHeight+1){s-=.5;el.style.fontSize=s+'px';}
    if(el.scrollHeight>el.clientHeight+1)el.setAttribute('data-autofit-floor','');
  }
  function all(){document.querySelectorAll('[data-autofit]').forEach(fit);}
  all();
  function done(){document.documentElement.setAttribute('data-autofit-done','');}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){all();done();});}
  else{done();}
})();
</script>
</body>
</html>
