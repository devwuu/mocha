<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title th:text="${card.coffeeName} + ' · 모카'">커피 레시피</title>
<style>
  /* 로컬 번들 폰트(ADR-11, 이식 편차 — 시안의 Google Fonts CDN 대체). artifact/fonts/는 렌더러가 채운다. */
  @font-face{font-family:'Gowun Dodum';src:url('fonts/GowunDodum-Regular.ttf') format('truetype');font-display:swap}
  html,body{margin:0;padding:0}
  /* 카드 = 4:5(1080×1350) 뷰포트 스크린샷. 시안 실측 460×575(동일 4:5)를 치수 무환산으로 이식하고
     스케일 래퍼(×1080/460)로 실 규격을 채운다 — 시안이 디자인 원본이라 환산 전사 오류를 없앤다(ADR-54).
     autofit 측정은 레이아웃 좌표라 하한도 시안 값(10.5) 그대로다. */
  body{width:1080px;height:1350px;overflow:hidden;background:#efe9e2}
  .scale{width:460px;height:575px;transform:scale(2.3478260870);transform-origin:top left}
</style>
</head>
<body>
<div class="scale">
<div style="width:460px;height:575px;background:#f6ead9;border-radius:6px;box-shadow:0 2px 12px rgba(43,31,22,.12);display:flex;flex-direction:column;padding:22px 26px 16px;box-sizing:border-box;font-family:'Gowun Dodum',sans-serif;color:#4d3320">
  <!--/* FR-7 ①②: 마스코트 + 커피명·로스터리·날짜 + 방식 뱃지.
       POLICY: method는 표시 전용이다 — 이 아래 어디에서도 분기 조건으로 쓰지 않는다(ADR-87). */-->
  <div style="display:flex;align-items:center;gap:13px">
    <!--/* ADR-54 편차④: 마스코트는 클래스패스 번들 → artifact 루트 복사본을 상대 참조 */-->
    <img th:src="${mascotHref}" alt="모카" style="width:52px;height:52px;flex:none;border-radius:50%;object-fit:cover;border:2px solid #e3c9a4;background:#f3e3cc">
    <div>
      <div style="font-size:10.5px;color:#b08a5c"
           th:text="${card.roastery != null ? card.coffeeName + ' · ' + card.roastery : card.coffeeName}">커피 이름 · 로스터리</div>
      <div style="font-size:19px;font-weight:700;color:#3f2a17;line-height:1.35">이렇게 내렸어요</div>
      <div style="font-size:11.5px;color:#8c6a44" th:text="${fmt.full(card.date)}">2026년 7월 10일</div>
    </div>
    <div style="margin-left:auto;align-self:flex-start;background:#f0e0cd;border:1.5px solid #e3c9a4;color:#7a5836;border-radius:999px;padding:3px 11px;font-size:10.5px;white-space:nowrap"
         th:if="${card.recipe.method != null}" th:text="${card.recipe.method}">핸드드립</div>
  </div>
  <!--/* FR-7 ③ 3열 6타일 그리드 — 어느 값이 어느 칸에 가는지는 뷰 모델(NoteView.RecipeCard.tiles())이
       이미 확정해 넘긴다. 템플릿은 목록을 행 우선으로 흘려 넣기만 하고 판정을 하지 않는다(ADR-87).
       값 있는 타일만 담겨 오므로 3개면 1행이 차고 2개면 1행에 2칸만 차며, 남는 칸은 시안 그대로
       비워 둔다(2026-08-10 사용자 확정 — type-a와 같은 규칙이지만 그림이 다르다: 이 테마는 흰 카드
       배경에 gap:8px라 빈 칸이 흰색으로 빈다. type-a는 gap이 구분선이라 색 블록으로 드러난다).
       단위·비율 접두는 뷰 모델에서 이미 붙어 있다(두 테마의 타일 어휘·표기가 시안에서 동일). */-->
  <th:block th:with="tiles=${card.tiles()}">
    <div style="margin-top:12px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 0 #e8d3b4;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:8px"
         th:if="${!tiles.isEmpty()}">
      <div th:each="tile : ${tiles}"
           style="background:#f6e7d2;border-radius:10px;padding:9px 6px;text-align:center;min-height:52px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box">
        <div style="font-size:10px;color:#b08a5c;margin-bottom:3px" th:text="${tile.label()}">원두</div>
        <!--/* 시간 표기는 "2분 40초" — 시안의 콜론 표기는 기각이다(이식 편차, ADR-87 D-7). 서브라벨(추출량의
             비율·분쇄도의 그라인더명)은 시안의 그라인더 span 자리를 그대로 쓴다. */-->
        <div style="font-size:16px;font-weight:700;color:#3f2a17"><span th:text="${tile.value()}">210</span><span
             style="font-size:9.5px;font-weight:400;color:#a3854f;margin-left:4px"
             th:if="${tile.sub() != null}" th:text="${tile.sub()}">매버릭 2.0</span></div>
      </div>
    </div>
  </th:block>
  <!--/* FR-7 ④⑤ 텍스트 블록 2종(상세 레시피·레시피 피드백) — 둘 다 autofit이다(D-9로 상세 레시피가 합류).
       값 없는 블록은 라벨까지 통째로 숨긴다(AC-25).
       type-a와 달리 flex:1 래퍼가 없다 — 이 테마의 시안에는 하단 푸터가 없어서 «숨김»이 밀어낼 대상이
       없다. 한 블록이 빠지면 남은 블록이 flex:1로 자유 공간을 그대로 받고, 둘 다 빠지면 그리드 아래가
       빈다(푸터가 딸려 올라올 자리 자체가 없다). type-a가 래퍼를 둔 이유는 거기에 푸터가 있어서다. */-->
  <div style="margin-top:10px;flex:1;display:flex;flex-direction:column;gap:7px;min-height:0"
       th:if="${card.recipe.detail != null}">
    <div style="display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:#d9b98c"></span><span style="font-size:10.5px;color:#b08a5c">상세 레시피</span></div>
    <div style="flex:1;background:#fff;border-radius:14px;padding:12px 15px;box-shadow:0 2px 0 #e8d3b4;min-height:0;overflow:hidden;display:flex">
      <!--/* white-space:pre-line — 사용자가 넣은 줄바꿈 보존(데이터 충실. 시안 예시는 단문이라 무영향).
           시안 예시 문장 말미의 총 시간 병기는 이식하지 않는다 — 시간 타일이 같은 값을 이미 보여주므로
           카드 안에 두 번 나온다(이식 편차, ADR-87 D-7). */-->
      <div data-autofit="10.5" style="flex:1;min-height:0;overflow:hidden;font-size:13px;line-height:1.8;color:#5c4529;white-space:pre-line"
           th:text="${card.recipe.detail}">상세 레시피</div>
    </div>
  </div>
  <div style="margin-top:10px;flex:1;display:flex;flex-direction:column;gap:7px;min-height:0"
       th:if="${card.recipe.feedback != null}">
    <div style="display:flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:#d9b98c"></span><span style="font-size:10.5px;color:#b08a5c">다음엔 이렇게 내려볼래요</span></div>
    <div style="flex:1;background:#fff;border-radius:14px;padding:12px 15px;border:1.5px dashed #d9b98c;min-height:0;overflow:hidden;display:flex">
      <div data-autofit="10.5" style="flex:1;min-height:0;overflow:hidden;font-size:13px;line-height:1.8;white-space:pre-line"
           th:text="${card.recipe.feedback}">피드백</div>
    </div>
  </div>
</div>
</div>
<script>
/* 시안 autofit 이식(ADR-54 — 대상은 두 텍스트 영역, 하한 = data-autofit 값. 상세 쪽의 합류는
   changes/0030 D-9). 정적 1회 렌더라 시안의 MutationObserver·resize 트리거는 제외하고
   즉시 1회 + fonts.ready 재실행으로 단순화했다.
   완료(data-autofit-done)·하한 도달(data-autofit-floor) 마커는 래스터화 대기·로깅 배선(plan §6)의 입력. */
(function(){
  function fit(el){
    if(!el.dataset.fitBase)el.dataset.fitBase=getComputedStyle(el).fontSize;
    el.style.fontSize=el.dataset.fitBase;
    el.removeAttribute('data-autofit-floor');
    var s=parseFloat(el.dataset.fitBase);
    var min=parseFloat(el.getAttribute('data-autofit'))||10;
    while(s>min && el.scrollHeight>el.clientHeight+1){s-=.5;el.style.fontSize=s+'px';}
    if(el.scrollHeight>el.clientHeight+1)el.setAttribute('data-autofit-floor','');
  }
  function all(){document.querySelectorAll('[data-autofit]').forEach(fit);}
  all();
  function done(){document.documentElement.setAttribute('data-autofit-done','');}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){all();done();});}
  else{done();}
})();
</script>
</body>
</html>
